name = "localhive-olivia"
main = "src/index.js"
compatibility_date = "2026-07-01"

# The proxy needs the Firebase WEB API key to verify sign-ins via
# accounts:lookup. It is a public app identifier, not a secret — it ships in
# every client build — but committing anything key-shaped trips secret
# scanners, so it is stored on the worker instead:
#   npx wrangler secret put FIREBASE_API_KEY

# Set to "false" only for local experiments. Leaving it unset (or "true") means
# every request must carry a valid LocalHive sign-in.
# REQUIRE_AUTH = "true"

# GROQ_API_KEY is deliberately NOT here — it is a secret, set with:
#   npx wrangler secret put GROQ_API_KEY
