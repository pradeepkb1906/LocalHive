name: localhive
description: "LocalHive — one app for local home services, Indian grocery stores, and food trucks across the USA."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  http: ^1.6.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# App icon generation. Sources are built from assets/brand/localhive_mark.svg
# by tool/make_icons.py; regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/brand/icon_1024.png"
  android: true
  # Android crops adaptive foregrounds to a circle, so the padded artwork is
  # used here rather than the full-bleed mark.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/icon_1024.png"
    background_color: "#FFFFFF"
    theme_color: "#0A2540"
